<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockManager - Connexion</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="form-container">
                    {% if messages %}
                    {% for message in messages %}
                        {{ message }}
                    {% endfor %}
                {% endif %}
                    <div class="system-logo">
                        <!-- Placeholder for logo -->
                        <h1> <span style="color: rgb(0, 0, 0);">Stock</span><span style="color: #3498db;">Manager</span></h1>
                    </div>
                    
                    <!-- Login heading -->
                    <h4 class="mb-4 text-center">Connexion</h4>
                    
                    <!-- Login Form -->
                    <div>
                        <form id="loginForm" method="post" action="{% url 'login' %}">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="loginUsername" class="form-label">Nom Utilisateur</label>
                                <input type="text" name="username" class="form-control" id="loginUsername" required>
                            </div>
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">Mot de passe</label>
                                <input type="password" name="password" class="form-control" id="loginPassword" required>
                                <a href="#" class="forgot-password">Mot de passe oublié?</a>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Connexion</button>
                        </form>
                        <div class="info-section mt-3">
                            <p class="mb-0"><strong>Information :</strong> Connectez-vous avec vos identifiants pour accéder au système de gestion de stock.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        // Display error messages if any

    </script>
</body>
</html>
